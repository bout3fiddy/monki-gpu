exclude: '^(fortran/|build/|validation/runs/)'

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatting
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]

      - id: python-readability
        name: Python paragraph spacing
        entry: uv run python scripts/linting/check_readability.py
        language: system
        types: [python]
        pass_filenames: false

      - id: basedpyright
        name: Python types
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock
        name: Dependency lock consistency
        entry: uv lock --check
        language: system
        files: '^(pyproject.toml|uv.lock)$'
        pass_filenames: false

      - id: gpu-format
        name: GPU kernels and host bridge formatting
        entry: uv run clang-format --dry-run --Werror
        language: system
        files: '^kernels/(metal|cuda|common)/.*\.(metal|m|h|cuh|cu|cpp)$'
